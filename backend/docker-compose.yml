version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fincloud_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fincloud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fincloud_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fincloud_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fincloud_network

  # FastAPI Backend
  backend:
    build: .
    container_name: fincloud_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fincloud_db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    networks:
      - fincloud_network

    # command: >
    #   sh -c "python -m alembic upgrade head &&
    #          uvicorn app.main:app --host 0.0.0.0 --port 8000"

    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fincloud_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fincloud.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fincloud_network

volumes:
  postgres_data:
  redis_data:

networks:
  fincloud_network:
    driver: bridge
