AWSTemplateFormatVersion: "2010-09-09"
Description: "FinCloud-AI Read-Only IAM Role for Cost Explorer and CUR access"
Parameters:
  ExternalId:
    Type: String
    Description: "Unique External ID generated by FinCloud-AI"
    MaxLength: 64
Resources:
  FinCloudAIReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FinCloudAIReadOnlyRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: "*"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: FinCloudAIReadOnlyPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - ce:GetTags
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - "*"
Outputs:
  RoleArn:
    Description: "ARN of the created IAM role"
    Value: !GetAtt FinCloudAIReadOnlyRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"
  RoleName:
    Description: "Name of the created IAM role"
    Value: !Ref FinCloudAIReadOnlyRole
    Export:
      Name: !Sub "${AWS::StackName}-RoleName"
